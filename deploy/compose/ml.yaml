# Machine learning services (ADR-0011): MLflow, the forecasting API and the forecast job.

services:
  mlflow:
    build:
      context: ../mlflow
    depends_on:
      db-users:
        condition: service_completed_successfully
    environment:
      # Run metadata lives in its own 'mlflow' database in the TimescaleDB container, as its own login;
      # artifacts (models, tables) go to a volume. The password is URL-safe (see .env.example).
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:?add MLFLOW_DB_PASSWORD to .env (see .env.example)}@timescaledb:5432/mlflow
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Serves stored forecasts (step 2.6b) as the read-only 'forecasting' login. Docs at http://localhost:8000/docs.
  forecasting-api:
    build: &forecasting-build
      context: ../..
      dockerfile: services/forecasting/Dockerfile
      args:
        GRIDPULSE_VERSION: ${GRIDPULSE_VERSION:-dev}
    depends_on:
      db-users:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: timescaledb
      TIMESCALE_PORT: "5432" # the container port, not the host port in .env
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:?add FORECAST_DB_PASSWORD to .env (see .env.example)}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Loads each task's champion from the MLflow registry, forecasts the next 48 hours and stores it, as the
  # 'forecast_job' login. Seconds, not minutes: training is the separate train-job. Not started by
  # `docker compose up`; run it with  docker compose --profile jobs run --rm forecast-job
  # Phase 4 schedules both as Kubernetes CronJobs (forecasts often, training weekly).
  forecast-job:
    profiles: [jobs]
    build: *forecasting-build
    command: ["python", "-m", "gridpulse_forecasting", "forecast", "--task", "all"]
    depends_on:
      db-users:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
      FORECAST_JOB_DB_PASSWORD: ${FORECAST_JOB_DB_PASSWORD:?add FORECAST_JOB_DB_PASSWORD to .env (see .env.example)}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    restart: "no"

  # Retrains each task, gates the result against the champion and registers it (training.py), as the read-only
  # 'forecasting' login: training only reads.  docker compose --profile jobs run --rm train-job
  train-job:
    profiles: [jobs]
    build: *forecasting-build
    command: ["python", "-m", "gridpulse_forecasting", "train", "--task", "all"]
    depends_on:
      db-users:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      POSTGRES_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gridpulse}
      FORECAST_DB_PASSWORD: ${FORECAST_DB_PASSWORD:?add FORECAST_DB_PASSWORD to .env (see .env.example)}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    restart: "no"

volumes:
  mlflow-artifacts:
