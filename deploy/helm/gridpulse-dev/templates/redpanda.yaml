{{- $ctx := dict "root" . "component" "redpanda" -}}
{{- $v := .Values.redpanda -}}
# Redpanda (Kafka API and schema registry), one broker with a persistent volume, in dev-container mode as in Compose.
# It advertises the Service name, so every pod in the namespace reaches it as redpanda:9092.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  labels:
    {{- include "dev.labels" $ctx | nindent 4 }}
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      {{- include "dev.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dev.labels" $ctx | nindent 8 }}
    spec:
      {{- include "dev.podSecurity" (dict "user" 101) | nindent 6 }}
      containers:
        - name: redpanda
          image: {{ $v.image }}
          args:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory={{ $v.memory }}
            - --kafka-addr=0.0.0.0:9092
            - --advertise-kafka-addr=redpanda:9092
            - --schema-registry-addr=0.0.0.0:8081
            - --rpc-addr=0.0.0.0:33145
            - --advertise-rpc-addr=127.0.0.1:33145
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: registry, containerPort: 8081 }
            - { name: admin, containerPort: 9644 }
          startupProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /v1/status/ready, port: admin }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- include "dev.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/redpanda/data }
            - { name: config, mountPath: /etc/redpanda } # `redpanda start` writes its config file here
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $v.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  labels:
    {{- include "dev.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "dev.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
    - { name: registry, port: 8081, targetPort: registry }
    - { name: admin, port: 9644, targetPort: admin }
---
# Topics, then schemas, from the kafka-init image (step 4.4a), after every install and upgrade. Both steps are
# idempotent. Without --wait Helm runs this hook as soon as the broker's StatefulSet exists, so it waits for the
# broker itself.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-init
  labels:
    {{- include "dev.labels" (dict "root" . "component" "kafka-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "dev.labels" (dict "root" . "component" "kafka-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "dev.podSecurity" (dict "user" 10001) | nindent 6 }}
      containers:
        - name: kafka-init
          image: {{ include "dev.image" (dict "root" . "repository" .Values.kafkaInit.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              until rpk cluster health 2>/dev/null | grep -qE 'Healthy:.+true'; do
                echo "waiting for the broker"; sleep 3
              done
              create-topics.sh && python -I /opt/gridpulse/schemas/tools/register_schemas.py
          env:
            - { name: RPK_BROKERS, value: "redpanda:9092" }
            - { name: RPK_ADMIN_HOSTS, value: "redpanda:9644" }
            - { name: SCHEMA_REGISTRY_URL, value: "http://redpanda:8081" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          {{- include "dev.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
