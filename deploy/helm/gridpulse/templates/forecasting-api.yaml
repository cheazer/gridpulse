{{- $ctx := dict "root" . "component" "forecasting-api" -}}
{{- $v := .Values.forecastingApi -}}
# Serves stored forecasts, as the read-only 'forecasting' login (ADR-0011).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "gridpulse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gridpulse.labels" $ctx | nindent 8 }}
    spec:
      {{- include "gridpulse.podSecurity" (dict "user" .Values.users.default) | nindent 6 }}
      containers:
        - name: forecasting-api
          image: {{ include "gridpulse.image" (dict "root" . "repository" $v.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          env:
            {{- include "gridpulse.databaseEnv" . | nindent 12 }}
            {{- include "gridpulse.secretEnv" (dict "root" . "name" "FORECAST_DB_PASSWORD") | nindent 12 }}
            {{- include "gridpulse.telemetryEnv" . | nindent 12 }}
          {{- include "gridpulse.httpProbes" (dict) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- include "gridpulse.containerSecurity" . | nindent 10 }}
          {{- include "gridpulse.tmpVolumeMount" . | nindent 10 }}
      {{- include "gridpulse.tmpVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "gridpulse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
