{{- $ctx := dict "root" . "component" "scheduler-api" -}}
{{- $v := .Values.schedulerApi -}}
# The carbon-aware scheduling API (ADR-0013). /ready needs the database; the forecasting API is only "degraded" when
# down, since the scheduler can fall back to NESO's forecasts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicas }} # with autoscaling the HPA owns this; setting it here would reset it on every upgrade
  {{- end }}
  selector:
    matchLabels:
      {{- include "gridpulse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gridpulse.labels" $ctx | nindent 8 }}
    spec:
      {{- include "gridpulse.podSecurity" (dict "user" .Values.users.dotnet) | nindent 6 }}
      containers:
        - name: scheduler-api
          image: {{ include "gridpulse.image" (dict "root" . "repository" $v.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            {{- include "gridpulse.databaseEnv" . | nindent 12 }}
            {{- include "gridpulse.secretEnv" (dict "root" . "name" "SCHEDULER_DB_PASSWORD") | nindent 12 }}
            - name: FORECASTING_API_URL
              value: "http://{{ include "gridpulse.name" (dict "root" . "component" "forecasting-api") }}:8000"
            {{- include "gridpulse.telemetryEnv" . | nindent 12 }}
          {{- include "gridpulse.httpProbes" (dict) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- include "gridpulse.containerSecurity" . | nindent 10 }}
          {{- include "gridpulse.tmpVolumeMount" . | nindent 10 }}
      {{- include "gridpulse.tmpVolume" . | nindent 6 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "gridpulse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
{{- if $v.autoscaling.enabled }}
---
# More pods when the API is busy, fewer when it isn't: CPU is what a schedule request spends (it searches the forecast
# for the cleanest window), and the API is stateless, so any pod can answer any request. Scaling down waits five
# minutes (Kubernetes' default) so a burst doesn't make it flap.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "gridpulse.name" $ctx }}
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    # A new pod's first requests spike its CPU while .NET compiles the hot paths (measured at 112-180% of request for
    # under a minute), and by default the autoscaler adds pods at once, each of which then spikes the same way. Only
    # scale up on load that lasts a minute.
    scaleUp:
      stabilizationWindowSeconds: 60
{{- end }}
