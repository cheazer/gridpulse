{{- $ctx := dict "root" . "component" "timescale-sink" -}}
{{- $v := .Values.timescaleSink -}}
# Consumes the event topics and upserts into TimescaleDB. Replicas share the partitions through the consumer group, and
# writes are idempotent, so a rolling update that briefly runs two is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gridpulse.name" $ctx }}
  labels:
    {{- include "gridpulse.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      {{- include "gridpulse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gridpulse.labels" $ctx | nindent 8 }}
    spec:
      {{- include "gridpulse.podSecurity" (dict "user" .Values.users.default) | nindent 6 }}
      containers:
        - name: timescale-sink
          image: {{ include "gridpulse.image" (dict "root" . "repository" $v.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            {{- include "gridpulse.databaseEnv" . | nindent 12 }}
            {{- include "gridpulse.secretEnv" (dict "root" . "name" "POSTGRES_USER") | nindent 12 }}
            {{- include "gridpulse.secretEnv" (dict "root" . "name" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "gridpulse.telemetryEnv" . | nindent 12 }}
          {{- include "gridpulse.springProbes" . | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- include "gridpulse.containerSecurity" . | nindent 10 }}
          {{- include "gridpulse.tmpVolumeMount" . | nindent 10 }}
      {{- include "gridpulse.tmpVolume" . | nindent 6 }}
