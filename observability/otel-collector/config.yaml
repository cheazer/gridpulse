# The OpenTelemetry Collector: the one address every service sends to (OTLP, step 4.2, ADR-0014).
# Traces go on to Tempo; metrics are held here for Prometheus to scrape. Services never know which backends exist,
# so swapping one is a change to this file only.

receivers:
  otlp:
    protocols:
      http: # what every GridPulse service uses: OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
        endpoint: 0.0.0.0:4318
      grpc: # accepted too, for tools that default to it
        endpoint: 0.0.0.0:4317

processors:
  # Refuse data before running out of memory, rather than being killed and losing everything buffered.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attributes (service.name, deployment.environment, ...) become labels on every series, so a query
    # can say service_name="scheduler-api".
    resource_to_telemetry_conversion:
      enabled: true
    # A series not updated for this long is dropped: a job or pod that has gone away stops being reported.
    metric_expiration: 10m

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    metrics: # the collector's own metrics (accepted, refused, exported), scraped by Prometheus too
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
