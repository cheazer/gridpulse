# Data sources as code: Grafana starts with them, nothing is clicked together by hand.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s # the scrape interval: rate() windows shorter than this have no data

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # From a span, jump to that service's request metrics around the same time.
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags: [{ key: service.name, value: service_name }]
        queries:
          - name: Request duration (p95)
            query: histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$$__tags}[5m])))
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
