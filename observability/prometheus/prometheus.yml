# Prometheus scrapes the collector, which holds every service's metrics (pushed to it over OTLP), and the
# collector's own health metrics, and evaluates GridPulse's alert rules (rules/, tested in tests/).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    # honor_labels: the labels on each series (service_name, ...) describe the service that sent it, not the
    # collector Prometheus happened to scrape it from.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-self
    static_configs:
      - targets: ["otel-collector:8888"]
