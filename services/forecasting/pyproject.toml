[project]
name = "gridpulse-forecasting"
version = "0.1.0"
description = "Demand and carbon-intensity forecasting for GridPulse (Phase 2, ADR-0011)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# What the API needs. The jobs (forecast, train, backtest) also need the "jobs" group below: the API's image leaves
# it out, which takes it from about 1 GB to a fraction of that.
dependencies = [
    "fastapi>=0.115",
    # Traces and metrics over OTLP/HTTP (step 4.1); the same protocol and port as every other service.
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-psycopg>=0.66b0",
    "opentelemetry-sdk>=1.45,<2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.6",
    "uvicorn>=0.30",
]

[dependency-groups]
# Modelling: features, LightGBM, the model registry. Installed by default (see tool.uv), so `uv sync`, the tests and
# the jobs' image have it; only the API's image goes without.
jobs = [
    "holidays>=0.60",
    "lightgbm>=4.7,<5",
    # The MLflow client without the server's dependencies; same minor version as the server in Compose.
    "mlflow-skinny>=3.17,<3.18",
    "pandas>=3.0",
    "pyarrow>=18",
]
dev = [
    "httpx2>=2.15",  # FastAPI's TestClient (Starlette has moved from httpx to httpx2)
    "mypy>=1.13",
    "pandas-stubs>=3.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.8",
]

[tool.uv]
default-groups = ["dev", "jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse_forecasting"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, naming, datetime-without-tz, pandas-vet, ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "DTZ", "PD", "RUF"]
# pivot over pivot_table: pivot fails on duplicate keys, where pivot_table would silently average them.
ignore = ["PD010"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["gridpulse_forecasting"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["testcontainers.*", "pyarrow.*", "mlflow.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = ["integration: needs Docker (starts a TimescaleDB container)"]
