spring:
  application:
    name: ingestion-app
  main:
    # Virtual threads are daemon threads, and this app has no web server or consumer to hold the
    # JVM open: without keep-alive it exits as soon as start-up finishes.
    keep-alive: true
  threads:
    virtual:
      enabled: true # pollers spend their time waiting on HTTP and Kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true # no duplicates from producer retries
        linger.ms: 20 # batch the ~1,700 events of one poll into few requests

gridpulse:
  sources:
    carbon-intensity: # ADR-0006
      base-url: https://api.carbonintensity.org.uk
      cron: "0 2/30 * * * *"
      poll-on-startup: true
      lookback: PT2H
      national-revision-interval: PT30M
      regional-revision-interval: PT3H
      http:
        connect-timeout: PT10S
        read-timeout: PT30S
        requests-per-second: 2 # no published limit; be polite
        burst: 2
        retry:
          max-retries: 4
          initial-delay: PT1S
          max-delay: PT30S
    open-meteo: # ADR-0008
      forecast-base-url: https://api.open-meteo.com/v1
      archive-base-url: https://archive-api.open-meteo.com/v1
      forecast-cron: "0 20 * * * *" # hourly; revisions are bucketed to 6 hours
      reanalysis-cron: "0 40 6 * * *" # daily; the archive lags real time by about a day
      poll-on-startup: true
      forecast-days: 3 # covers 24-48 hours ahead from any time of day
      revision-interval: PT6H
      reanalysis-days: 10
      locations:
        - { id: london, latitude: 51.5074, longitude: -0.1278, region: london }
        - { id: birmingham, latitude: 52.4862, longitude: -1.8904, region: west-midlands }
        - { id: manchester, latitude: 53.4808, longitude: -2.2426, region: north-west-england }
        - { id: leeds, latitude: 53.8008, longitude: -1.5491, region: yorkshire }
        - { id: edinburgh, latitude: 55.9533, longitude: -3.1883, region: south-scotland }
        - { id: cardiff, latitude: 51.4816, longitude: -3.1791, region: south-wales }
        - { id: norwich, latitude: 52.6309, longitude: 1.2974, region: east-england }
        - { id: aberdeen, latitude: 57.1497, longitude: -2.0943, region: north-scotland }
      http:
        connect-timeout: PT10S
        read-timeout: PT30S
        requests-per-second: 1 # published limit 600/min; each location counts as a call
        burst: 1
        retry:
          max-retries: 4
          initial-delay: PT1S
          max-delay: PT30S
    elexon: # ADR-0007
      base-url: https://data.elexon.co.uk/bmrs/api/v1
      cron: "0 16,46 * * * *" # outturn is published within 15 minutes of a period ending
      poll-on-startup: true
      lookback-days: 1 # re-fetch the previous settlement day too
      http:
        connect-timeout: PT10S
        read-timeout: PT30S
        requests-per-second: 5 # no published limit; be polite
        burst: 5
        retry:
          max-retries: 4
          initial-delay: PT1S
          max-delay: PT30S
