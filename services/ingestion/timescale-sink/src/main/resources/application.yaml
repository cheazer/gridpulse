spring:
  application:
    name: timescale-sink
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${TIMESCALE_PORT:5432}/${POSTGRES_DB:gridpulse}
    username: ${POSTGRES_USER:gridpulse}
    password: ${POSTGRES_PASSWORD} # no default: must come from the environment
    hikari:
      maximum-pool-size: 5
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: timescale-sink
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      max-poll-records: 500
    producer: # used only to publish to dead-letter topics, forwarding the original bytes
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
    listener:
      type: batch
      ack-mode: batch # commit offsets after the listener (and so the DB transaction) returns
      concurrency: 3

gridpulse:
  sink:
    aggregates: # ADR-0009: refresh daily views for writes older than the policy reaches
      policy-window: P30D # must match start_offset in db/migrations/V3
      refresh-interval: PT1M
