[versions]
jackson = "3.2.3"
json-schema-validator = "3.0.8"
junit = "6.1.3"
assertj = "3.27.7"
spotless = "8.10.4"
# Its BOM manages Spring, Kafka, Testcontainers, Flyway, the PostgreSQL driver and Awaitility versions.
spring-boot = "4.1.1"

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# Used by build-logic to apply these plugins from convention plugins
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
