name: ingestion

on:
  push:
    branches: [main]
    paths: ["services/ingestion/**", "schemas/**", ".github/workflows/ingestion.yml"]
  pull_request:
    paths: ["services/ingestion/**", "schemas/**", ".github/workflows/ingestion.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Caches dependencies and validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile (warnings are errors), check formatting, run tests
        run: ./gradlew build --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-test-reports
          path: services/ingestion/**/build/reports/tests/
